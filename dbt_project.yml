name: "capstone_23692"
version: "1.0.0"
config-version: 2 # doubt

# This setting configures which "profile" dbt uses for this project.
profile: "default"

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"


# ============================================================
# MODEL CONFIGURATION
# ============================================================

models:

  Capstone_23692:

    # --------------------------------------------------------
    # BRONZE / STAGING
    # --------------------------------------------------------

    staging:

      bronze:
        +schema: "{{ env_var('DBT_BRONZE_SCHEMA') }}"


    # --------------------------------------------------------
    # SILVER
    # --------------------------------------------------------

    silver:
      +schema: "{{ env_var('DBT_SILVER_SCHEMA') }}"


    # --------------------------------------------------------
    # GOLD
    #
    # Everything inside marts belongs to GOLD.
    #
    # This includes:
    #   - Dimensions
    #   - Facts
    #   - Reporting views
    #
    # Therefore there is NO separate reporting schema.
    # --------------------------------------------------------

    gold:
      +schema: "{{ env_var('DBT_GOLD_SCHEMA') }}"


  # ----------------------------------------------------------
  # ELEMENTARY
  # ----------------------------------------------------------

  elementary:
    +schema: elementary